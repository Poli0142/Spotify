<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoundHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">SoundHub</div>
        <nav id="nav">
            <a data-page="home" class="active">Главная</a>
            <a data-page="search">Поиск</a>
            <a data-page="top">Популярное</a>
            <a data-page="liked">Любимые</a>
            <a data-page="history">История</a>
            <a data-page="studio" data-role="ARTIST" hidden>Мои треки</a>
            <a data-page="admin" data-role="ADMIN" hidden>Управление</a>
        </nav>
        <div class="library">
            <div class="library-head">
                <span>Мои плейлисты</span>
                <button id="newPlaylist" title="Создать плейлист">+</button>
            </div>
            <ul id="playlists"></ul>
        </div>
        <div class="user">
            <div class="me">
                <div id="meCover" class="cover round mini"></div>
                <div class="me-text">
                    <div id="meName"></div>
                    <div id="meRole" class="muted"></div>
                </div>
            </div>
            <button id="logout" class="link small">Выйти</button>
        </div>
    </aside>
    <main id="content"></main>
</div>

<footer class="player">
    <div class="now">
        <div class="cover small" id="nowCover"></div>
        <div class="now-text">
            <div id="nowTitle">Ничего не играет</div>
            <div id="nowArtist" class="muted"></div>
        </div>
        <button id="like" class="heart" title="Любимые" hidden>&#9825;</button>
    </div>
    <div class="controls">
        <div class="buttons">
            <button id="shuffle" title="Перемешать">&#8644;</button>
            <button id="prev">&#9198;</button>
            <button id="play" class="play">&#9654;</button>
            <button id="next">&#9197;</button>
            <button id="repeat" title="Повтор">&#8635;</button>
        </div>
        <div class="progress">
            <span id="cur">0:00</span>
            <div class="bar" id="bar"><div id="fill"></div></div>
            <span id="dur">0:00</span>
        </div>
    </div>
    <div class="side"><a id="scLink" target="_blank" rel="noopener" hidden>SoundCloud</a></div>
</footer>

<div id="auth" class="auth hidden">
    <div class="auth-box">
        <div class="logo">SoundHub</div>
        <form id="loginForm">
            <h2>Вход</h2>
            <input name="username" placeholder="Логин" required autocomplete="username">
            <input name="password" type="password" placeholder="Пароль" required autocomplete="current-password">
            <button class="primary">Войти</button>
            <button type="button" class="link" data-switch>Регистрация</button>
        </form>
        <form id="registerForm" hidden>
            <h2>Регистрация</h2>
            <input name="username" placeholder="Логин" required maxlength="50" autocomplete="username">
            <input name="displayName" placeholder="Имя или название исполнителя" required maxlength="100">
            <input name="password" type="password" placeholder="Пароль" required minlength="4" autocomplete="new-password">
            <select name="role">
                <option value="USER">Слушатель</option>
                <option value="ARTIST">Исполнитель</option>
            </select>
            <button class="primary">Зарегистрироваться</button>
            <button type="button" class="link" data-switch>Уже есть аккаунт</button>
        </form>
    </div>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-box">
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <button class="link" id="modalClose">Закрыть</button>
    </div>
</div>

<div id="toast"></div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script src="app.js"></script>
</body>
</html>
